<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Mira Flight — Mission Builder</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&family=Roboto:wght@300;400;500;700;900&family=Roboto+Mono:wght@400;500;600;700&display=swap">
<style>
  html, body { margin: 0; padding: 0; background: #06080C; font-family: 'Roboto', system-ui, sans-serif; color: #F8FAFC; }
  * { box-sizing: border-box; }
  .ms {
    font-family: 'Material Symbols Outlined';
    font-weight: normal;
    font-style: normal;
    line-height: 1;
    letter-spacing: normal;
    text-transform: none;
    white-space: nowrap;
    direction: ltr;
    -webkit-font-feature-settings: 'liga';
    font-feature-settings: 'liga';
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  button { font-family: inherit; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="hud-tokens.jsx"></script>
<script type="text/babel" src="hud-views.jsx"></script>

<script type="text/babel" src="builder-data.jsx"></script>
<script type="text/babel" src="builder-map.jsx"></script>
<script type="text/babel" src="builder-rails.jsx"></script>
<script type="text/babel" src="builder-picker.jsx"></script>
<script type="text/babel" src="builder-timeline.jsx"></script>
<script type="text/babel" src="builder-views.jsx"></script>

<script type="text/babel">
function App() {
  return (
    <DesignCanvas
      title="Mira Flight — Mission Builder"
      subtitle="Galaxy Tab S10+ · 2304 × 1440 · asset-first · 6 routine templates · timeline routine builder as the bolder take"
    >
      <DCSection id="hero" title="Editor — hero state" subtitle="Asset picked · Orbit routine · params on right, asset summary on left, map dominates">
        <DCArtboard id="builder-hero" label="Builder · Orbit on Tank-04" width={2304} height={1440}>
          <BuilderHero/>
        </DCArtboard>
      </DCSection>

      <DCSection id="picker" title="Side state A — Asset library picker" subtitle="Library expands on the left · all assets pinned on the map · preview + suggested routines on the right">
        <DCArtboard id="builder-picker" label="Builder · pick an asset" width={2304} height={1440}>
          <BuilderAssetPicker/>
        </DCArtboard>
      </DCSection>

      <DCSection id="timeline" title="Side state B — Timeline routine builder (bolder)" subtitle="Same chassis, but the routine is a video-editor-style timeline · each stage is editable, durations are proportional">
        <DCArtboard id="builder-timeline" label="Builder · timeline view" width={2304} height={1440}>
          <BuilderTimelineView/>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
